<svg width="500" height="300" viewBox="0 0 500 300" xmlns="http://www.w3.org/2000/svg">

  <!-- Fundo transparente -->

  <!-- Lamparina -->
  <g transform="translate(100,40)">
    <!-- Chama -->
    <path d="M60 40 C45 20, 50 0, 60 -10 C70 5, 78 22, 60 40 Z"
          fill="#D4AF37"/>
    <path d="M60 30 C52 18, 55 8, 60 0 C68 10, 68 20, 60 30 Z"
          fill="#F7E7A9"/>

    <!-- Corpo -->
    <ellipse cx="60" cy="95" rx="40" ry="25" fill="#D4AF37"/>
    <rect x="28" y="70" width="64" height="35" rx="12"
          fill="#E8DCC5" stroke="#D4AF37" stroke-width="3"/>
    <ellipse cx="60" cy="70" rx="18" ry="8"
          fill="#D4AF37"/>

    <!-- Texto -->
    <text x="60" y="150"
          text-anchor="middle"
          font-family="Arial, sans-serif"
          font-size="28"
          fill="#B8860B"
          font-weight="bold">
      luz
    </text>
  </g>

  <!-- Pote de Sal -->
  <g transform="translate(300,50)">
    <!-- Tampa -->
    <rect x="35" y="10" width="50" height="15" rx="5"
          fill="#D4AF37"/>

    <!-- Pote -->
    <rect x="20" y="25" width="80" height="90" rx="15"
          fill="#E8DCC5"
          stroke="#D4AF37"
          stroke-width="3"/>

    <!-- Sal -->
    <path d="M30 85 Q60 55 90 85 L90 105 L30 105 Z"
          fill="#FAF7F2"/>

    <!-- Texto -->
    <text x="60" y="155"
          text-anchor="middle"
          font-family="Arial, sans-serif"
          font-size="28"
          fill="#B8860B"
          font-weight="bold">
      sal
    </text>
  </g>

</svg>