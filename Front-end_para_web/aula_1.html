<!-- Declaração da versão HTML5 para o navegador -->
<!DOCTYPE html>
<!-- Elemento raiz com definição do idioma -->
<html lang="pt-br">
<!-- ínio da seção de configurações e metadados (não visível na página) -->
<head>
    <!-- Define a codificação ára siporte correto a acentuação -->
    <meta charset="UTF-8">
    <!-- Configura a escala da tela para dispositivos móveis  -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Título exibido na aba do navegador -->
    <title>Document</title>
</head>

<!-- Início da seção do conteúdo visível  -->
<body>
<!-- Texto que será efetivamente exibido na tela para o usuário -->
    <h1>Olá, mundo!
        Hello, world!
    </h1>
    <!-- Conteúdo visível estruturado no corpo do cocumento -->
     <p>Este é um parágrafo de exemplo.</p>
     <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Architecto ab tempore nihil cupiditate beatae, debitis, odit repellat adipisci eum repellendus eveniet pariatur ut laborum assumenda earum, vitae molestiae deleniti sapiente!</p>
        
</body>
 <!-- Fim da seção do conteúdo visível   -->
</html>

<!-- Fechamento do elemento raiz  -->
